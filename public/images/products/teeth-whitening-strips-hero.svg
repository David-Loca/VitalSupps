<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="VitalSupps Teeth Whitening Strips styled product shot">
  <defs>
    <radialGradient id="tw7-bg" cx="0.42" cy="0.34" r="0.9">
      <stop offset="0%" stop-color="#3AA6E0" />
      <stop offset="42%" stop-color="#137bc2" />
      <stop offset="100%" stop-color="#0b3f61" />
    </radialGradient>
    <linearGradient id="tw7-box" x1="0" y1="0" x2="1" y2="0.06">
      <stop offset="0%" stop-color="#0a3f66" />
      <stop offset="16%" stop-color="#0e5c8f" />
      <stop offset="32%" stop-color="#137bc2" />
      <stop offset="50%" stop-color="#3aa6e0" />
      <stop offset="68%" stop-color="#137bc2" />
      <stop offset="84%" stop-color="#0e5c8f" />
      <stop offset="100%" stop-color="#0a3f66" />
    </linearGradient>
    <radialGradient id="tw7-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tw7-strip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#eaf6ff" stop-opacity="0.86" />
    </linearGradient>
    <linearGradient id="tw7-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="10%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#tw7-bg)" />
  <circle cx="330" cy="410" r="310" fill="#eaf6ff" opacity="0.10" />
  <circle cx="570" cy="700" r="180" fill="#d8a73c" opacity="0.08" />

  <!-- leaf motif (echoes the real VitalSupps logo mark) -->
  <g transform="translate(96,700) rotate(-18)" opacity="0.45">
    <path d="M0 90 C -6 48 8 10 42 0 C 48 34 44 66 18 84 C 12 88 6 90 0 90 Z" fill="none" stroke="#eaf6ff" stroke-width="2" />
    <path d="M4 84 C 14 54 24 30 40 4" fill="none" stroke="#eaf6ff" stroke-width="1.3" opacity="0.8" />
  </g>

  <ellipse cx="410" cy="878" rx="210" ry="34" fill="url(#tw7-shadow)" />

  <!-- fanned whitening strips behind the box -->
  <g opacity="0.92">
    <path d="M240 470 Q205 560 250 660 Q272 700 320 700 L320 470 Z" fill="url(#tw7-strip)" transform="rotate(-14 300 580)" />
    <path d="M260 460 Q225 555 275 655 Q298 696 344 696 L344 460 Z" fill="url(#tw7-strip)" opacity="0.9" transform="rotate(-6 320 570)" />
    <path d="M560 470 Q595 560 550 660 Q528 700 480 700 L480 470 Z" fill="url(#tw7-strip)" transform="rotate(14 500 580)" />
    <path d="M540 460 Q575 555 525 655 Q502 696 456 696 L456 460 Z" fill="url(#tw7-strip)" opacity="0.9" transform="rotate(6 480 570)" />
  </g>

  <!-- packaging box -->
  <rect x="300" y="330" width="200" height="420" rx="18" fill="url(#tw7-box)" />
  <rect x="300" y="330" width="200" height="420" rx="18" fill="url(#tw7-rim)" />
  <rect x="300" y="330" width="200" height="420" rx="18" fill="none" stroke="#eaf6ff" stroke-width="1.5" opacity="0.5" />

  <!-- sparkle / whitening icon -->
  <g transform="translate(400,410)" fill="#FFFFFF" opacity="0.92">
    <path d="M0 -34 L7 -9 L32 0 L7 9 L0 34 L-7 9 L-32 0 L-7 -9 Z" />
  </g>
  <circle cx="440" cy="378" r="5" fill="#FFFFFF" opacity="0.7" />
  <circle cx="362" cy="452" r="4" fill="#FFFFFF" opacity="0.6" />

  <!-- label plate -->
  <rect x="322" y="470" width="156" height="188" rx="5" fill="#0a3f66" opacity="0.92" />
  <rect x="322" y="470" width="156" height="188" rx="5" fill="none" stroke="#eaf6ff" stroke-width="1.2" />
  <text x="400" y="512" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="26" fill="#eaf6ff" letter-spacing="1.5">VitalSupps</text>
  <line x1="346" y1="526" x2="454" y2="526" stroke="#eaf6ff" stroke-width="1" opacity="0.7" />
  <text x="400" y="558" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-style="italic" font-size="19" fill="#FFFFFF">Whitening</text>
  <text x="400" y="580" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-style="italic" font-size="19" fill="#FFFFFF">Strips</text>
  <text x="400" y="602" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="9" fill="#FFFFFF" opacity="0.7" letter-spacing="2">PEROXIDE-FREE FORMULA</text>

  <rect x="356" y="618" width="88" height="24" rx="12" fill="#eaf6ff" />
  <text x="400" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9.5" fill="#0a3f66" letter-spacing="1">NO SLIP GRIP</text>

  <!-- base rim -->
  <rect x="308" y="742" width="184" height="12" rx="6" fill="#062a44" />
</svg>
