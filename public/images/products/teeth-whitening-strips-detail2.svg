<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Before and after smile comparison with VitalSupps whitening strips">
  <defs>
    <linearGradient id="tw9-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3f61" />
      <stop offset="100%" stop-color="#137bc2" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="1000" fill="url(#tw9-bg)" />
  <circle cx="200" cy="200" r="220" fill="#eaf6ff" opacity="0.06" />
  <circle cx="640" cy="820" r="240" fill="#d8a73c" opacity="0.08" />

  <text x="400" y="150" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="34" fill="#eaf6ff" letter-spacing="1">Before &amp; After</text>
  <line x1="330" y1="172" x2="470" y2="172" stroke="#eaf6ff" stroke-width="1" opacity="0.6" />

  <!-- BEFORE tooth -->
  <g transform="translate(240,420)">
    <text x="0" y="-140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#eaf6ff" opacity="0.7" letter-spacing="2">BEFORE</text>
    <path d="M-70 -90 Q-90 -20 -60 60 Q-40 120 0 120 Q40 120 60 60 Q90 -20 70 -90 Q40 -120 0 -120 Q-40 -120 -70 -90 Z"
          fill="#d8c79a" stroke="#a68a52" stroke-width="2" />
    <path d="M-20 -60 Q-30 0 -10 60" fill="none" stroke="#a68a52" stroke-width="1.4" opacity="0.6" />
  </g>

  <!-- arrow -->
  <path d="M420 420 L560 420" stroke="#eaf6ff" stroke-width="4" />
  <path d="M540 400 L568 420 L540 440" fill="none" stroke="#eaf6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AFTER tooth -->
  <g transform="translate(660,420)">
    <text x="0" y="-140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" letter-spacing="2">AFTER</text>
    <path d="M-70 -90 Q-90 -20 -60 60 Q-40 120 0 120 Q40 120 60 60 Q90 -20 70 -90 Q40 -120 0 -120 Q-40 -120 -70 -90 Z"
          fill="#FFFFFF" stroke="#eaf6ff" stroke-width="2" />
    <path d="M-30 -60 L-38 -30 L-28 -36 L-22 -8" fill="none" stroke="#3aa6e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <circle cx="40" cy="-70" r="4" fill="#d8a73c" />
    <circle cx="55" cy="-50" r="3" fill="#d8a73c" opacity="0.7" />
  </g>

  <!-- caption plate -->
  <rect x="200" y="760" width="400" height="110" rx="14" fill="#062a44" opacity="0.85" />
  <text x="400" y="805" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-style="italic" font-size="20" fill="#FFFFFF">Visibly whiter in 14 days</text>
  <text x="400" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#eaf6ff" opacity="0.75" letter-spacing="1.5">PEROXIDE-FREE · ENAMEL-SAFE</text>
</svg>
