<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="VitalSupps Gut Health styled product shot">
  <defs>
    <radialGradient id="gh7-bg" cx="0.58" cy="0.34" r="0.9">
      <stop offset="0%" stop-color="#C97A4E" />
      <stop offset="45%" stop-color="#8F4B2C" />
      <stop offset="100%" stop-color="#3A2015" />
    </radialGradient>
    <linearGradient id="gh7-glass" x1="0" y1="0" x2="1" y2="0.08">
      <stop offset="0%" stop-color="#0A0806" />
      <stop offset="16%" stop-color="#24140C" />
      <stop offset="38%" stop-color="#4A2416" />
      <stop offset="52%" stop-color="#6B3420" />
      <stop offset="66%" stop-color="#4A2416" />
      <stop offset="84%" stop-color="#24140C" />
      <stop offset="100%" stop-color="#0A0806" />
    </linearGradient>
    <linearGradient id="gh7-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E2C18" />
      <stop offset="26%" stop-color="#C05A32" />
      <stop offset="50%" stop-color="#E8925F" />
      <stop offset="74%" stop-color="#C05A32" />
      <stop offset="100%" stop-color="#5E2C18" />
    </linearGradient>
    <radialGradient id="gh7-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gh7-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="10%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#gh7-bg)" />
  <circle cx="470" cy="410" r="310" fill="#F3B98A" opacity="0.16" />
  <circle cx="250" cy="700" r="170" fill="#7FCB69" opacity="0.07" />

  <!-- leaf motif (echoes the real VitalSupps logo mark) -->
  <g transform="translate(700,700) rotate(18) scale(-1,1)" opacity="0.5">
    <path d="M0 90 C -6 48 8 10 42 0 C 48 34 44 66 18 84 C 12 88 6 90 0 90 Z" fill="none" stroke="#F3B98A" stroke-width="2" />
    <path d="M4 84 C 14 54 24 30 40 4" fill="none" stroke="#F3B98A" stroke-width="1.3" opacity="0.8" />
  </g>

  <ellipse cx="392" cy="882" rx="200" ry="36" fill="url(#gh7-shadow)" />

  <!-- cap -->
  <path d="M294 206 L490 206 L480 300 L304 300 Z" fill="url(#gh7-cap)" />
  <path d="M294 206 L490 206 L480 300 L304 300 Z" fill="url(#gh7-rim)" />
  <line x1="316" y1="230" x2="470" y2="230" stroke="#2E140C" stroke-width="1" opacity="0.35" />
  <line x1="312" y1="252" x2="474" y2="252" stroke="#2E140C" stroke-width="1" opacity="0.35" />
  <line x1="308" y1="274" x2="478" y2="274" stroke="#2E140C" stroke-width="1" opacity="0.35" />

  <!-- shoulder -->
  <path d="M304 300 Q392 328 480 300 L488 332 Q392 360 296 332 Z" fill="url(#gh7-glass)" />

  <!-- bottle body -->
  <path d="M296 332
           L488 332
           L498 692
           Q498 760 440 760
           L344 760
           Q286 760 286 692
           Z"
        fill="url(#gh7-glass)" />
  <path d="M296 332
           L488 332
           L498 692
           Q498 760 440 760
           L344 760
           Q286 760 286 692
           Z"
        fill="url(#gh7-rim)" />

  <!-- label -->
  <rect x="314" y="412" width="156" height="234" rx="5" fill="#1A0D07" opacity="0.92" />
  <rect x="314" y="412" width="156" height="234" rx="5" fill="none" stroke="#E8925F" stroke-width="1.3" />
  <text x="392" y="456" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="28" fill="#F3B98A" letter-spacing="1.5">VitalSupps</text>
  <line x1="340" y1="472" x2="444" y2="472" stroke="#E8925F" stroke-width="1" />
  <text x="392" y="506" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-style="italic" font-size="23" fill="#FFFFFF">Gut Health</text>
  <text x="392" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="10" fill="#FFFFFF" opacity="0.68" letter-spacing="2">PROBIOTIC &amp; PREBIOTIC</text>

  <rect x="348" y="554" width="88" height="26" rx="13" fill="#E8925F" />
  <text x="392" y="571" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" fill="#2E140C" letter-spacing="1">DAILY CARE</text>

  <line x1="336" y1="596" x2="448" y2="596" stroke="#FFFFFF" stroke-width="0.75" opacity="0.25" />
  <text x="392" y="616" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="9" fill="#FFFFFF" opacity="0.55" letter-spacing="1.5">DIETARY SUPPLEMENT</text>

  <!-- capsules -->
  <g>
    <rect x="128" y="702" width="46" height="18" rx="9" fill="#F3B98A" stroke="#C05A32" stroke-width="1" transform="rotate(-20 151 711)" />
    <rect x="128" y="702" width="23" height="18" rx="9" fill="#5E2C18" transform="rotate(-20 151 711)" />
    <rect x="600" y="640" width="40" height="16" rx="8" fill="#F3B98A" stroke="#C05A32" stroke-width="1" transform="rotate(24 620 648)" />
    <rect x="600" y="640" width="20" height="16" rx="8" fill="#5E2C18" transform="rotate(24 620 648)" />
  </g>

  <!-- base rim -->
  <rect x="294" y="752" width="196" height="14" rx="7" fill="#0A0503" />
</svg>
