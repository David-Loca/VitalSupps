<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="VitalSupps Gut Health styled product shot">
  <defs>
    <radialGradient id="gh6-bg" cx="0.58" cy="0.36" r="0.85">
      <stop offset="0%" stop-color="#6E7A5C" />
      <stop offset="45%" stop-color="#48513B" />
      <stop offset="100%" stop-color="#20241A" />
    </radialGradient>
    <linearGradient id="gh6-glass" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="16%" stop-color="#1C1C1C" />
      <stop offset="40%" stop-color="#3A3A3A" />
      <stop offset="58%" stop-color="#1C1C1C" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    <linearGradient id="gh6-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a733f" />
      <stop offset="30%" stop-color="#E8D5A3" />
      <stop offset="52%" stop-color="#C4A35A" />
      <stop offset="75%" stop-color="#E8D5A3" />
      <stop offset="100%" stop-color="#8a733f" />
    </linearGradient>
    <radialGradient id="gh6-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gh6-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#gh6-bg)" />
  <circle cx="470" cy="420" r="300" fill="#E8D5A3" opacity="0.12" />

  <!-- botanical sprig prop -->
  <g stroke="#E8D5A3" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M700 760 Q650 700 660 610 Q664 560 630 520" />
    <path d="M686 742 Q660 720 668 680" />
    <path d="M696 700 Q670 686 676 654" />
    <path d="M676 660 Q650 648 656 618" />
    <path d="M664 610 Q640 596 644 566" />
  </g>

  <ellipse cx="392" cy="880" rx="196" ry="34" fill="url(#gh6-shadow)" />

  <!-- cap -->
  <path d="M296 210 L488 210 L478 300 L306 300 Z" fill="url(#gh6-cap)" />
  <line x1="316" y1="232" x2="470" y2="232" stroke="#111111" stroke-width="1" opacity="0.2" />
  <line x1="312" y1="252" x2="474" y2="252" stroke="#111111" stroke-width="1" opacity="0.2" />
  <line x1="308" y1="272" x2="478" y2="272" stroke="#111111" stroke-width="1" opacity="0.2" />

  <!-- shoulder -->
  <path d="M306 300 Q392 326 478 300 L486 330 Q392 356 298 330 Z" fill="url(#gh6-glass)" />

  <!-- bottle body -->
  <path d="M298 330
           L486 330
           L496 690
           Q496 758 440 758
           L344 758
           Q288 758 288 690
           Z"
        fill="url(#gh6-glass)" />
  <path d="M298 330
           L486 330
           L496 690
           Q496 758 440 758
           L344 758
           Q288 758 288 690
           Z"
        fill="url(#gh6-sheen)" />

  <!-- gold foil label -->
  <rect x="316" y="410" width="152" height="230" rx="4" fill="none" stroke="#C4A35A" stroke-width="1.2" />
  <text x="392" y="454" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-size="28" fill="#E8D5A3" letter-spacing="1.5">VitalSupps</text>
  <line x1="340" y1="470" x2="444" y2="470" stroke="#C4A35A" stroke-width="1" />
  <text x="392" y="504" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-style="italic" font-size="22" fill="#FFFFFF">Gut Health</text>
  <text x="392" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="10" fill="#FFFFFF" opacity="0.65" letter-spacing="2">PROBIOTIC &amp; PREBIOTIC</text>

  <rect x="350" y="552" width="84" height="24" rx="12" fill="#C4A35A" />
  <text x="392" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="10" fill="#111111" letter-spacing="1">DAILY CARE</text>

  <line x1="336" y1="592" x2="448" y2="592" stroke="#FFFFFF" stroke-width="0.75" opacity="0.25" />
  <text x="392" y="612" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="9" fill="#FFFFFF" opacity="0.5" letter-spacing="1.5">DIETARY SUPPLEMENT</text>

  <!-- capsules -->
  <g>
    <rect x="130" y="700" width="44" height="17" rx="8.5" fill="#E8D5A3" stroke="#C4A35A" stroke-width="1" transform="rotate(-20 152 708)" />
    <rect x="130" y="700" width="22" height="17" rx="8.5" fill="#48513B" transform="rotate(-20 152 708)" />
  </g>

  <!-- base rim -->
  <rect x="296" y="750" width="192" height="12" rx="6" fill="#020202" />
</svg>
