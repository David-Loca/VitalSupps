<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="VitalSupps Methylene Blue styled product shot">
  <defs>
    <radialGradient id="mb7-bg" cx="0.42" cy="0.36" r="0.9">
      <stop offset="0%" stop-color="#4C7A3A" />
      <stop offset="42%" stop-color="#2F5426" />
      <stop offset="100%" stop-color="#132212" />
    </radialGradient>
    <linearGradient id="mb7-glass" x1="0" y1="0" x2="1" y2="0.08">
      <stop offset="0%" stop-color="#0A0700" />
      <stop offset="14%" stop-color="#3A2408" />
      <stop offset="30%" stop-color="#6B4110" />
      <stop offset="46%" stop-color="#8F5A16" />
      <stop offset="58%" stop-color="#6B4110" />
      <stop offset="76%" stop-color="#341F07" />
      <stop offset="100%" stop-color="#0A0700" />
    </linearGradient>
    <linearGradient id="mb7-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#153E10" />
      <stop offset="26%" stop-color="#4E9A3B" />
      <stop offset="50%" stop-color="#7FCB69" />
      <stop offset="74%" stop-color="#4E9A3B" />
      <stop offset="100%" stop-color="#153E10" />
    </linearGradient>
    <radialGradient id="mb7-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mb7-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="10%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#mb7-bg)" />
  <circle cx="340" cy="420" r="310" fill="#7FCB69" opacity="0.12" />
  <circle cx="560" cy="700" r="180" fill="#137bc2" opacity="0.06" />

  <!-- leaf motif (echoes the real VitalSupps logo mark) -->
  <g transform="translate(96,700) rotate(-18)" opacity="0.5">
    <path d="M0 90 C -6 48 8 10 42 0 C 48 34 44 66 18 84 C 12 88 6 90 0 90 Z" fill="none" stroke="#9FE38A" stroke-width="2" />
    <path d="M4 84 C 14 54 24 30 40 4" fill="none" stroke="#9FE38A" stroke-width="1.3" opacity="0.8" />
  </g>

  <ellipse cx="410" cy="880" rx="196" ry="36" fill="url(#mb7-shadow)" />

  <!-- dropper cap -->
  <rect x="356" y="112" width="108" height="132" rx="12" fill="url(#mb7-cap)" />
  <rect x="356" y="112" width="108" height="132" rx="12" fill="url(#mb7-rim)" />
  <rect x="374" y="242" width="72" height="16" rx="4" fill="#0E1F0B" />

  <!-- dropper rod -->
  <rect x="404" y="250" width="12" height="132" fill="#E8D5A3" opacity="0.35" />

  <!-- neck -->
  <path d="M374 246 L374 280 Q374 298 358 312 L326 344" fill="none" stroke="#0A0700" stroke-width="3" />
  <path d="M446 246 L446 280 Q446 298 462 312 L494 344" fill="none" stroke="#0A0700" stroke-width="3" />

  <!-- bottle body -->
  <path d="M326 344
           Q296 378 296 434
           L296 750
           Q296 802 348 802
           L472 802
           Q524 802 524 750
           L524 434
           Q524 378 494 344
           Z"
        fill="url(#mb7-glass)" />
  <path d="M326 344
           Q296 378 296 434
           L296 750
           Q296 802 348 802
           L472 802
           Q524 802 524 750
           L524 434
           Q524 378 494 344
           Z"
        fill="url(#mb7-rim)" />

  <!-- liquid meniscus hint near shoulder -->
  <path d="M300 402 Q410 388 520 402" fill="none" stroke="#C77F1E" stroke-width="1.5" opacity="0.45" />

  <!-- label -->
  <rect x="320" y="470" width="180" height="214" rx="5" fill="#0F160D" opacity="0.92" />
  <rect x="320" y="470" width="180" height="214" rx="5" fill="none" stroke="#7FCB69" stroke-width="1.3" />
  <text x="410" y="521" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="34" fill="#9FE38A" letter-spacing="2">VitalSupps</text>
  <line x1="352" y1="539" x2="468" y2="539" stroke="#7FCB69" stroke-width="1" />
  <text x="410" y="578" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-style="italic" font-size="25" fill="#FFFFFF">Methylene Blue</text>
  <text x="410" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#FFFFFF" opacity="0.68" letter-spacing="2.5">COGNITIVE FOCUS SUPPORT</text>

  <rect x="365" y="632" width="90" height="26" rx="13" fill="#7FCB69" />
  <text x="410" y="649" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" fill="#0E1F0B" letter-spacing="1">USP GRADE</text>

  <!-- base rim -->
  <rect x="302" y="794" width="216" height="14" rx="7" fill="#060400" />
</svg>
