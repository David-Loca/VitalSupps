<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="VitalSupps Methylene Blue styled product shot">
  <defs>
    <radialGradient id="mb6-bg" cx="0.42" cy="0.38" r="0.85">
      <stop offset="0%" stop-color="#8A6A46" />
      <stop offset="45%" stop-color="#5E4530" />
      <stop offset="100%" stop-color="#2A1F16" />
    </radialGradient>
    <linearGradient id="mb6-glass" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="16%" stop-color="#1C1C1C" />
      <stop offset="40%" stop-color="#3A3A3A" />
      <stop offset="58%" stop-color="#1C1C1C" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    <linearGradient id="mb6-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a733f" />
      <stop offset="30%" stop-color="#E8D5A3" />
      <stop offset="52%" stop-color="#C4A35A" />
      <stop offset="75%" stop-color="#E8D5A3" />
      <stop offset="100%" stop-color="#8a733f" />
    </linearGradient>
    <radialGradient id="mb6-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mb6-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#mb6-bg)" />
  <circle cx="330" cy="430" r="300" fill="#B08D57" opacity="0.14" />

  <!-- botanical sprig prop -->
  <g stroke="#E8D5A3" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M92 760 Q150 700 140 610 Q136 560 170 520" />
    <path d="M108 742 Q140 720 132 680" />
    <path d="M96 700 Q126 686 120 654" />
    <path d="M118 660 Q148 648 142 618" />
    <path d="M130 610 Q158 596 154 566" />
  </g>

  <ellipse cx="410" cy="878" rx="190" ry="34" fill="url(#mb6-shadow)" />

  <!-- dropper cap -->
  <rect x="358" y="118" width="104" height="128" rx="10" fill="url(#mb6-cap)" />
  <rect x="358" y="118" width="16" height="128" rx="8" fill="#FFFFFF" opacity="0.18" />
  <rect x="374" y="242" width="72" height="14" rx="4" fill="#151515" />

  <!-- dropper rod -->
  <rect x="404" y="248" width="12" height="130" fill="#D8D8D8" opacity="0.4" />

  <!-- neck -->
  <path d="M374 246 L374 280 Q374 298 358 312 L326 344" fill="none" stroke="#050505" stroke-width="3" />
  <path d="M446 246 L446 280 Q446 298 462 312 L494 344" fill="none" stroke="#050505" stroke-width="3" />

  <!-- bottle body -->
  <path d="M326 344
           Q296 378 296 434
           L296 750
           Q296 800 346 800
           L474 800
           Q524 800 524 750
           L524 434
           Q524 378 494 344
           Z"
        fill="url(#mb6-glass)" />
  <path d="M326 344
           Q296 378 296 434
           L296 750
           Q296 800 346 800
           L474 800
           Q524 800 524 750
           L524 434
           Q524 378 494 344
           Z"
        fill="url(#mb6-sheen)" />

  <!-- gold foil label -->
  <rect x="322" y="470" width="176" height="210" rx="4" fill="none" stroke="#C4A35A" stroke-width="1.2" />
  <text x="410" y="520" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-size="34" fill="#E8D5A3" letter-spacing="2">VitalSupps</text>
  <line x1="352" y1="538" x2="468" y2="538" stroke="#C4A35A" stroke-width="1" />
  <text x="410" y="576" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-style="italic" font-size="24" fill="#FFFFFF">Methylene Blue</text>
  <text x="410" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#FFFFFF" opacity="0.65" letter-spacing="2.5">COGNITIVE FOCUS SUPPORT</text>

  <rect x="368" y="628" width="84" height="24" rx="12" fill="#C4A35A" />
  <text x="410" y="644" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="10" fill="#111111" letter-spacing="1">USP GRADE</text>

  <!-- base rim -->
  <rect x="304" y="792" width="212" height="12" rx="6" fill="#020202" />
</svg>
